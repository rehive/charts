# Exercises secretManager with workers, env, an existing node selector and
# gcloud credentials together. Used by `helm template` / server dry runs.
deployment:
  replicaCount: 1
  command: [gunicorn, config.wsgi, --bind, 0.0.0.0:8000]
  args: null
  nodeSelector:
    pool: general
image:
  repository: gcr.io/rehive-services/example
  tag: abc123
env:
  ALLOWED_HOSTS: "*"
  WEB_CONCURRENCY: 3
gcloudCredentials:
  enabled: true
  kubernetesSecret: gcloud-credentials
secretManager:
  enabled: true
  environment: staging
  keys: [SECRET_KEY, SENTRY_DSN]
workers:
  enabled: true
  deployments:
  - name: worker-general
    replicaCount: 1
    command: [celery, -A, config.celery, worker, -Q, general]
    resources: {}
