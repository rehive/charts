{{- if .Values.secretManager.enabled }}
{{- $sm := .Values.secretManager }}
{{- $prefix := include "rehive-service.secretManager.prefix" . }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "rehive-service.secretManager.className" . }}
  labels:
    {{ include "rehive-service.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range $sm.keys }}
      - resourceName: "projects/{{ $sm.project }}/locations/{{ $sm.location }}/secrets/{{ $prefix }}{{ . }}/versions/latest"
        path: "{{ . }}"
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rehive-service.secretManager.loaderName" . }}
  labels:
    {{ include "rehive-service.labels" . | nindent 4 }}
data:
  {{ base .Values.secretManager.loaderPath }}: |
    #!/bin/sh
    # Exports each file in the Secret Manager mount as an environment
    # variable named after the file, then runs the given command.
    set -eu
    for f in {{ $sm.mountPath }}/*; do
      [ -f "$f" ] || continue
      export "$(basename "$f")=$(cat "$f")"
    done
    exec "$@"
{{- end }}
