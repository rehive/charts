apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rehive-service.fullname" . }}
  labels:
    {{ include "rehive-service.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "rehive-service.fullname" . }}
    app.kubernetes.io/component: server
  {{- with include "rehive-service.deploymentAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rehive-service.fullname" . }}
      app.kubernetes.io/component: server
  strategy:
    {{- toYaml .Values.deployment.strategy | nindent 4 }}
  template:
    metadata:
      annotations:
        helm/revision: "{{ .Release.Revision }}" # Hack to force restart on upgrade
      labels:
        app.kubernetes.io/name: {{ include "rehive-service.fullname" . }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "rehive-service.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      {{- with include "rehive-service.nodeSelector" (dict "root" $ "nodeSelector" .Values.deployment.nodeSelector) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.deployment.topologySpreadConstraints | nindent 8 }}
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "rehive-service.fullname" . }}
              app.kubernetes.io/component: server
      {{- end }}
      {{- with .Values.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: webapp
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.service.internalPort }}
        command:
          {{- include "rehive-service.command" (dict "root" $ "command" .Values.deployment.command) | nindent 12 }}
        args:
          {{- range $key, $value := .Values.deployment.args }}
          {{- if $value }}
          - --{{ $key }}={{ $value }}
          {{- else }}
          - --{{ $key }}
          {{- end }}
          {{- end }}
        lifecycle:
          {{- toYaml .Values.deployment.lifecycle | nindent 12 }}
        env:
        {{- if .Values.gcloudCredentials.enabled }}
          - name: GOOGLE_APPLICATION_CREDENTIALS
            value: "/etc/credentials/{{ .Values.gcloudCredentials.kubernetesSecret }}.json"
        {{- end }}
          - name: VERSION
            value: "{{ .Values.image.tag }}"
          {{ include "rehive-service.plugins" . | nindent 10 }}
          {{- include "rehive-service.env" . | nindent 10 }}
        {{- if .Values.envFromSecret.enabled }}
        envFrom:
          - secretRef:
              name: {{ .Values.envFromSecret.name | default (include "rehive-service.fullname" .) }}
        {{- end }}
        {{- with .Values.service.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.service.livenessProbe }}
        livenessProbe:
          {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.service.readinessProbe }}
        readinessProbe:
          {{ toYaml . | nindent 10 }}
        {{- end}}
        resources:
          {{ toYaml .Values.deployment.resources | nindent 10 }}
        {{- with include "rehive-service.volumeMounts" . }}
        volumeMounts:
          {{- . | nindent 10 }}
        {{- end }}
      {{- if (eq "azure" .Values.vendor.name) }}
      dnsConfig:
        options:
        - name: single-request-reopen
      {{- end }}
      {{- with include "rehive-service.volumes" . }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- $imagePullSecret := .Values.imagePullSecrets | default dict }}
      {{- if $imagePullSecret.name}}
      imagePullSecrets:
      - name: {{ $imagePullSecret.name}}
      {{- end }}
